<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324a">
<title>বৈদ্য গ্রিল ফ্যাক্টরি</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1f2a37;--mut:#64707d;--bd:#e3e8ef;--p:#d9480f;--p2:#f59f00;--a:#0b9e92;--nv:#16324a;--sh:0 8px 28px rgba(20,40,70,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--tx:#eef2f6;--mut:#9aa7b4;--bd:#2a3744;--nv:#0c1a27;--sh:0 8px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--tx:#eef2f6;--mut:#9aa7b4;--bd:#2a3744;--nv:#0c1a27;--sh:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.65;font-size:16px;overflow-x:hidden}
img{max-width:100%}
a{color:inherit}
/* announcement */
.ann{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;overflow:hidden;white-space:nowrap;font-size:14px;padding:6px 0;font-weight:500}
.ann span{display:inline-block;padding-left:100%;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--card);display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 2px 14px #0002;border-bottom:3px solid var(--a)}
.lg{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}.lg img,.lg svg{width:100%;height:100%;object-fit:cover;display:block}
header h1{font-size:19px;margin:0;flex:1;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{border:0;background:var(--a);color:#fff;border-radius:22px;padding:8px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.hb.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
@media(max-width:520px){.hb .t{display:none}header h1{font-size:17px}}
.nv{background:var(--nv);display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}.nv::-webkit-scrollbar{display:none}
.nv a{color:#fff;padding:12px 14px;white-space:nowrap;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;text-decoration:none;transition:.25s}
.nv a:hover{border-color:var(--p2);background:#ffffff1a}
/* hero */
.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:56px 18px 78px;background:linear-gradient(120deg,#16324a,#1971c2,#7048e8,#e64980,#f76707,#16324a);background-size:400% 400%;animation:gs 16s ease infinite}
@keyframes gs{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.hero>*{position:relative;z-index:2}
.hero h2{font-size:clamp(28px,7vw,46px);margin:14px 0 8px;text-shadow:0 3px 14px #0006;animation:up .9s both}
.hero p{max-width:580px;margin:0 auto 24px;font-size:17px;opacity:.96;animation:up .9s .2s both}
.hero .bt2{animation:up .9s .4s both}
.hl{width:92px;height:92px;margin:0 auto;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 30px #0005;animation:fl 4s ease-in-out infinite}.hl img,.hl svg{width:100%;height:100%;object-fit:cover;display:block}
.sp{position:absolute!important;font-size:28px;opacity:.5;z-index:1!important;animation:fl 5s ease-in-out infinite}
.hg{position:absolute!important;inset:0;width:100%;height:100%;opacity:.17;z-index:1!important}
.hg path{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 3.2s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(22px)}to{opacity:1;transform:none}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;vertical-align:middle;line-height:1.3;text-align:center;border:0;cursor:pointer;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;padding:12px 26px;border-radius:30px;font:inherit;font-weight:700;text-decoration:none;box-shadow:0 6px 18px #0003;transition:transform .2s;margin:3px}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.96)}
.btn:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
@keyframes sh{to{left:140%}}
.btn.s{background:var(--a)}.btn.r{background:#e03131}.btn.w{background:#25d366}.btn.g{background:#868e96}.btn.sm{padding:6px 14px;font-size:13px;box-shadow:none}
/* stats */
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;max-width:960px;margin:-40px auto 0;padding:0 14px;position:relative;z-index:3}
.st div{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--sh)}.st b{display:block;font-size:28px;color:var(--p);line-height:1.2}.st small{color:var(--mut)}
/* cats */
.cats{display:flex;gap:14px;overflow-x:auto;padding:22px 16px 8px;scrollbar-width:none;max-width:1000px;margin:0 auto}.cats::-webkit-scrollbar{display:none}
.cats a{flex:0 0 auto;text-align:center;font-size:13px;width:84px;cursor:pointer;transition:transform .25s}.cats a:hover{transform:translateY(-5px)}
.cats span{display:flex;width:66px;height:66px;margin:0 auto 4px;border-radius:50%;align-items:center;justify-content:center;font-size:30px;background-size:cover;background-position:center;border:3px solid var(--a);box-shadow:0 4px 12px #0002;background-color:#d0ebff}
.cats a:nth-child(5n+1) span{background-color:#ffe3e3}.cats a:nth-child(5n+2) span{background-color:#d3f9d8}.cats a:nth-child(5n+3) span{background-color:#d0ebff}.cats a:nth-child(5n+4) span{background-color:#fff3bf}.cats a:nth-child(5n+5) span{background-color:#e5dbff}
/* sections */
section{max-width:1000px;margin:0 auto;padding:30px 14px}
h3{font-size:24px;margin:0 0 18px;position:relative;display:inline-block;padding-bottom:7px}
h3:after{content:"";position:absolute;left:0;bottom:0;height:4px;width:60%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--p2))}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.rv.in .card,.rv.in .fe>div,.rv.in .rvc{animation:pop .6s backwards;animation-delay:calc(var(--i,0)*80ms)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s;border-top:4px solid var(--a)}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 34px #0003}
.card .im{height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;background-size:cover;background-position:center;transition:transform .5s}.card:hover .im{transform:scale(1.08)}
.card .imw{overflow:hidden}
.card .b{padding:12px 14px 14px}.card b{display:block;font-size:17px}.card small{color:var(--mut)}
.card .q{display:block;width:100%;margin-top:10px;padding:9px;border:2px solid var(--a);background:transparent;color:var(--a);border-radius:10px;font:inherit;font-weight:700;cursor:pointer;transition:.25s}
.card .q:hover{background:var(--a);color:#fff}
.c0{border-top-color:#fa5252}.c1{border-top-color:#40c057}.c2{border-top-color:#339af0}.c3{border-top-color:#fcc419}.c4{border-top-color:#845ef7}
.c0 .im{background-color:#ffe3e3}.c1 .im{background-color:#d3f9d8}.c2 .im{background-color:#d0ebff}.c3 .im{background-color:#fff3bf}.c4 .im{background-color:#e5dbff}
.dg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.dg .im{height:110px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .im{height:115px}.card b{font-size:15px}.dg .im{height:95px}h3{font-size:21px}}
.fe{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fe>div{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--sh);text-align:center;transition:.3s}.fe>div:hover{transform:translateY(-5px)}
.fe i{display:block;font-style:normal;font-size:40px;transition:transform .4s}.fe>div:hover i{transform:scale(1.25) rotate(-8deg)}
.fe b{display:block;margin:6px 0 2px}.fe small{color:var(--mut)}
.rvw{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);border-left:5px solid var(--p2)}.rvw .stars{color:#fab005;letter-spacing:2px}
.box{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--sh);border-top:4px solid var(--a)}
.wel{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.wel>div:first-child{flex:1;min-width:240px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1000px;margin:0 auto;padding:10px 14px 30px}.two section{padding:20px 0;margin:0;max-width:none}
label{display:block;font-size:14px;margin:12px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
input[type=color]{height:46px;padding:3px}input[type=file]{padding:8px;font-size:14px}
footer{background:var(--nv);color:#dde6ee;text-align:center;padding:26px 14px calc(90px + env(safe-area-inset-bottom));font-size:14px}
footer a{color:var(--p2);text-decoration:none}.soc a{display:inline-block;margin:4px 6px;background:#ffffff1a;padding:6px 14px;border-radius:20px;color:#fff}
/* floating */
.wa{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0006;animation:wp 2.2s infinite}
.wa svg{width:32px;height:32px;fill:#fff}
@keyframes wp{0%{box-shadow:0 0 0 0 #25d366aa,0 6px 20px #0006}70%{box-shadow:0 0 0 18px #25d36600,0 6px 20px #0006}100%{box-shadow:0 0 0 0 #25d36600,0 6px 20px #0006}}
.wl{position:absolute;right:68px;background:#fff;color:#222;padding:6px 12px;border-radius:14px;font-size:13px;white-space:nowrap;box-shadow:0 4px 14px #0004;opacity:0;animation:wl 9s 2s both;pointer-events:none}
@keyframes wl{0%{opacity:0;transform:translateX(12px)}6%,80%{opacity:1;transform:none}100%{opacity:0}}
.bt{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px #0005;opacity:0;pointer-events:none;transform:translateY(24px) scale(.8);transition:.35s}
.bt.on{opacity:1;pointer-events:auto;transform:none}.bt:hover{transform:translateY(-3px)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 20px;border-radius:24px;z-index:100;opacity:0;transition:.3s;pointer-events:none;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
/* modal */
.ov2{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .25s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(60px);opacity:0}}
.mb{background:var(--card);color:var(--tx);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));position:relative;animation:su .35s}
.mb.wide{max-width:900px}
@media(min-width:600px){.ov2{align-items:center}.mb{border-radius:20px}}
.x{position:absolute;right:10px;top:10px;border:0;background:#0002;color:inherit;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.sm{background:#00a69922;border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.pm{display:block;border:2px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;color:var(--tx);transition:.2s}.pm.on{border-color:var(--a);background:#00a69914}.pm input{width:auto}.pm small{display:block;color:var(--mut)}
.qr{text-align:center;margin:10px 0}.qr img{width:210px;max-width:70%;border-radius:14px;border:6px solid #fff;box-shadow:0 4px 18px #0003;background:#fff}.qr small{display:block;color:var(--mut)}
/* admin */
.tabs{display:flex;flex-direction:column;gap:8px}.adm{max-width:1200px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}.adm .tabs{position:sticky;top:78px}.adc{min-width:0}@media(max-width:760px){.adm{grid-template-columns:1fr;gap:14px}.adm .tabs{position:static;display:grid;grid-template-columns:1fr 1fr}.adm .tabs button{padding:10px 12px;font-size:14px}}
.tabs button{width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 16px;border-radius:14px;font:inherit;font-size:16px;cursor:pointer;transition:.2s}.tabs button:hover{border-color:var(--a)}.tabs .on{background:var(--a);color:#fff;border-color:var(--a)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card);box-shadow:var(--sh)}
.ord input,.ord textarea{margin-bottom:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
.tag{padding:2px 12px;border-radius:12px;font-size:12px;color:#fff;background:#f08c00}.tag.d{background:#2f9e44}.tag.c{background:#868e96}
.th{width:60px;height:60px;border-radius:10px;flex:none;background:#ddd center/cover no-repeat}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx);margin:12px 0}.ck input{width:auto}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 14px;border-radius:18px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.noanim *,.noanim *:before,.noanim *:after{animation:none!important;transition:none!important}
.noanim .rv{opacity:1;transform:none}.noanim .hg path{stroke-dashoffset:0}.noanim .ann span{padding-left:0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hg path{stroke-dashoffset:0}}
.hrs{margin:10px 0 14px}.hst{display:inline-block;padding:3px 14px;border-radius:16px;font-weight:700;margin-bottom:8px;color:#fff;font-size:14px}.hst.on{background:#2f9e44}.hst.off{background:#e03131}
.hr{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;font-size:15px}.hr:nth-of-type(odd){background:#00a69914}.hr.td{background:var(--a);color:#fff}
.hero>.hs{position:absolute;inset:0;z-index:0;overflow:hidden}.hs:after{content:"";position:absolute;inset:0;background:linear-gradient(#0005,#0008)}
.hs .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}.hs .sl.on{opacity:1;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero>.dts{position:absolute;bottom:54px;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:8px;pointer-events:none}
.dts i{width:10px;height:10px;border-radius:50%;background:#fff6;cursor:pointer;pointer-events:auto;transition:.3s}.dts i.on{background:#fff;width:26px;border-radius:6px}
.hero>.bar{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}.hero>.bar.l{left:10px}.hero>.bar.r{right:10px}.hero>.bar:hover{background:#000a}
@media(max-width:520px){.hero>.bar{width:32px;height:32px;font-size:22px}}
.st2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.st2>div{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);text-align:center}.st2 b{display:block;font-size:28px;color:var(--p);line-height:1.2}.st2 small{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin:10px 0 4px}.chart div{flex:1;background:linear-gradient(var(--p2),var(--p));border-radius:5px 5px 0 0;min-height:3px;position:relative}.chart div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.chl{display:flex;gap:5px;font-size:11px;color:var(--mut)}.chl span{flex:1;text-align:center}
.bar2{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.bar2 i{display:block;height:8px;border-radius:4px;background:var(--a)}
.vr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}
/* ===== পণ্য/নকশা অ্যাডমিন ===== */
.pe{animation:fi .3s}
.pe-cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;scroll-snap-type:x proximity}.pe-cats::-webkit-scrollbar{display:none}
.pe-cat{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border-radius:40px;border:2px solid var(--qa);background:var(--card);box-shadow:var(--sh);cursor:pointer;font:inherit;color:var(--tx);text-align:left;transition:transform .2s,background .25s}
.pe-cat:hover{transform:translateY(-2px)}.pe-cat:active{transform:scale(.97)}
.pe-cat i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:23px;background:var(--qt) center/cover no-repeat;flex:none}
.pe-cat b{display:block;font-size:15px;line-height:1.25}.pe-cat small{color:var(--mut);font-size:12px}
.pe-cat.on{background:linear-gradient(120deg,var(--qa),var(--qb));color:#fff;box-shadow:0 8px 22px var(--qt)}.pe-cat.on small{color:#ffffffe0}.pe-cat.on i{background-color:#ffffff40}
.pe-cat.add{--qa:var(--bd);border-style:dashed;box-shadow:none;background:transparent;color:var(--mut)}.pe-cat.add i{background:var(--bg);font-size:26px}
.pe-hero{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;background:linear-gradient(125deg,var(--qa),var(--qb));box-shadow:var(--sh);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pe-hero:after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:#ffffff26;pointer-events:none}
.pe-hero>*{position:relative;z-index:1}
.pe-ph{width:66px;height:66px;border-radius:20px;background:#ffffff38 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.pe-hero h4{margin:0;font-size:22px;line-height:1.2}.pe-hero p{margin:3px 0 0;opacity:.94;font-size:13px}
.pe-hbs{display:flex;gap:6px;flex-wrap:wrap}.pe-hb{border:0;background:#ffffff3a;color:#fff;border-radius:12px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;transition:.2s}.pe-hb:hover{background:#ffffff66}
.pe-form{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh);border-left:6px solid var(--qa);animation:pop .3s}
.pe-form label{margin:10px 0 4px}.pe-form input,.pe-form select{margin-bottom:4px}
.pe-fl{cursor:pointer;margin:3px}
.pe-sw{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0}
.pe-c{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);padding:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pe-c.on{box-shadow:0 0 0 3px var(--tx);transform:scale(1.14)}
.pe-em{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}.pe-em button{border:1px solid var(--bd);background:var(--bg);border-radius:10px;font-size:20px;padding:2px 8px;cursor:pointer}.pe-em button:hover{border-color:var(--qa)}
.pe-subs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
.pe-lb{font-weight:700;margin-right:4px}
.pe-sub{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--qa);background:var(--qt);color:var(--tx);border-radius:22px;padding:6px 8px 6px 14px;font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.pe-sub em{font-style:normal;background:var(--qa);color:#fff;border-radius:11px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}
.pe-sub:hover{transform:translateY(-2px)}
.pe-sub.on{background:linear-gradient(120deg,var(--qa),var(--qb));color:#fff;border-color:transparent;box-shadow:0 6px 16px var(--qt)}.pe-sub.on em{background:#fff;color:var(--qa)}
.pe-sub.add{border:2px dashed var(--bd);background:transparent;color:var(--mut);padding:6px 14px}
.pe-add{border-radius:20px;padding:14px;background:var(--card);box-shadow:var(--sh);border:2px dashed var(--qa);margin:12px 0 18px}
.pe-add h5{margin:0 0 12px;font-size:15px;font-weight:600}.pe-path{color:var(--qa);font-weight:700}
.pe-ab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pe-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:14px 6px;margin:0;border-radius:16px;border:0;font:inherit;font-weight:700;font-size:15px;color:#fff;cursor:pointer;text-align:center;line-height:1.25;box-shadow:0 6px 16px #0002;transition:transform .15s}
.pe-btn span{font-size:30px;line-height:1.1}.pe-btn small{font-weight:400;opacity:.93;font-size:11.5px;color:#fff}.pe-btn:active{transform:scale(.95)}
.pe-btn.c1{background:linear-gradient(135deg,#e8590c,#fab005)}.pe-btn.c2{background:linear-gradient(135deg,#1c7ed6,#4dabf7)}.pe-btn.c3{background:linear-gradient(135deg,#2f9e44,#74c69d)}
.pe-hint{margin:10px 0 0;font-size:13px;color:var(--mut)}
.pe-gh{margin:6px 0 10px;font-size:16px}
.pe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pe-d{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);border-top:4px solid var(--qa)}
.pe-new{animation:pop .5s backwards}
.pe-di{position:relative;height:140px;background:var(--qt) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px}
.pe-tg{position:absolute;left:8px;top:8px;background:var(--qa);color:#fff;border-radius:12px;padding:1px 10px;font-size:12px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-ib{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.pe-ib label{margin:0;width:36px;height:36px;border-radius:50%;background:#000b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:transform .15s}.pe-ib label:active{transform:scale(.9)}
.pe-db{padding:10px}.pe-db input,.pe-db select{margin-bottom:6px;padding:8px 10px;font-size:15px}
.pe-del{width:100%;border:1px solid #e0313144;background:#e0313111;color:#e03131;border-radius:10px;padding:7px;font:inherit;font-size:14px;cursor:pointer}

.sbt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.sbt i{font-style:normal;font-size:11px;padding:1px 8px;border-radius:10px;color:var(--tx)}
.pub-subs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
/* লাইভ ক্যামেরা */
#cam{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;animation:fi .25s}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#111}
.cam-top{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;background:linear-gradient(#000b,transparent);z-index:2}
.cam-bar{position:absolute;bottom:0;left:0;right:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000d);color:#fff;z-index:2}
.cam-strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;min-height:52px;scrollbar-width:none}
.cam-strip i{flex:none;width:52px;height:52px;border-radius:9px;background:center/cover;border:2px solid #fff;animation:pop .3s}
.cam-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cam-sh{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#ffffffcc;cursor:pointer;transition:transform .1s;flex:none}.cam-sh:active{transform:scale(.88)}
.cam-b{border:0;background:#ffffff33;color:#fff;border-radius:26px;padding:11px 18px;font:inherit;cursor:pointer;backdrop-filter:blur(6px)}
.cam-b.ok{background:#2f9e44}.cam-b:disabled{opacity:.4}

@keyframes fl2{0%{opacity:.85}100%{opacity:0}}
#toast{z-index:300}

.abp{display:flex;gap:12px;align-items:center;margin-bottom:14px}.abp .f{flex:1;height:160px;border-radius:12px;overflow:hidden}.abp .o{width:110px;height:110px;border-radius:50%;border:3px solid var(--a);flex:none;overflow:hidden}.abp img{width:100%;height:100%;object-fit:cover;display:block}
.abmini{display:inline-flex;gap:8px;align-items:center;padding:6px 16px;border:1px solid var(--a);color:var(--a);border-radius:20px;font-size:13px;cursor:pointer;background:var(--card)}.abmini:hover{background:var(--a);color:#fff}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}

.gp{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000c);color:#fff;font-size:11px;line-height:1.3;padding:16px 6px 5px;text-align:left}.gp b{font-weight:600}
