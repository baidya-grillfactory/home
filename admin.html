<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* designs page: colourful animated tabs + eye-catching Back/Home */
.dpb .cats2{position:relative;gap:10px;padding:8px 4px 14px;margin:8px -4px 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dpb .cats2::-webkit-scrollbar{display:none}

.dpb .cats2 a.on{color:#fff;border-color:transparent;background:var(--tc);background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff));box-shadow:0 6px 16px rgba(0,0,0,.25);animation:ctIn .55s cubic-bezier(.2,.9,.3,1.3) calc(var(--i)*70ms) both,ctPulse 2.2s ease-in-out 1s infinite}

@keyframes ctSh{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

.c0{border-top-color:#fa5252}.c1{border-top-color:#40c057}.c2{border-top-color:#339af0}.c3{border-top-color:#fcc419}.c4{border-top-color:#845ef7}

.rs-cust{background:#e6fcf5;color:#087f5b}.rvw{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);border-left:5px solid var(--p2)}.rvw .stars{color:#fab005;letter-spacing:2px}

.ftw{max-width:1100px;margin:0 auto 18px;text-align:left}.ftg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 18px;padding-bottom:16px;border-bottom:1px solid #ffffff22}.ftc h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.8px;color:#9fb0c3;text-transform:uppercase}.ftc a,.ftc span{display:block;color:#fff;font-size:14px;line-height:1.45;margin:0 0 9px;cursor:pointer;word-break:break-word}.ftc span{color:#cfd9e4;font-size:13px;margin-bottom:5px}.ftc a.ftp{font-size:16px;font-weight:700;color:#ffd166;white-space:nowrap}.ftad{grid-column:span 2}.ftb{padding:14px 0 2px}.ftbt{font-size:12px;color:#9fb0c3;margin-bottom:8px}.ftbl{display:flex;flex-wrap:wrap;gap:8px}.ftbi{display:flex!important;align-items:center;justify-content:center;background:#fff;border-radius:8px;padding:4px 8px;height:34px;margin:0!important}.ftbi img{height:24px;width:auto;max-width:84px;object-fit:contain;display:block}@media(max-width:560px){.ftg{grid-template-columns:1fr 1fr}.ftml{grid-column:1/-1}.ftad{grid-column:1/-1}}

@keyframes lsp{to{transform:rotate(360deg)}}@keyframes lpu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes lbo{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}@keyframes lsw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}@keyframes lgl{0%,100%{box-shadow:0 8px 30px #0005}50%{box-shadow:0 0 38px 8px #f59f00cc}}@keyframes lfl{0%,60%,100%{transform:rotateY(0)}80%{transform:rotateY(180deg)}}
.nvm{position:absolute;left:0;right:0;top:100%;display:grid;grid-template-rows:0fr;visibility:hidden;background:var(--nv);box-shadow:0 14px 26px #0004;z-index:25;transition:grid-template-rows var(--ns,.7s) cubic-bezier(.25,.8,.25,1),visibility 0s linear var(--ns,.7s)}
.nvm.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--ns,.7s) cubic-bezier(.25,.8,.25,1),visibility 0s}
.nvm>div{min-height:0;overflow:hidden}.nvi{max-height:70vh;overflow-y:auto}
.nvm a{display:block;color:#fff;padding:14px 20px;border-bottom:1px solid #ffffff1f;cursor:pointer;font-size:15px;opacity:0;transform:translateY(-10px);transition:opacity .5s,transform .5s,background .2s}
.nvm.open a{opacity:1;transform:none;transition-delay:calc(var(--i)*70ms + .15s),calc(var(--i)*70ms + .15s),0s}.nvm a:hover{background:#ffffff1a}

#upb{position:fixed;left:12px;right:12px;bottom:84px;max-width:440px;margin:0 auto;background:#222;color:#fff;border-radius:14px;padding:10px 14px;z-index:320;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(20px);pointer-events:none;transition:.25s}#upb.on{opacity:1;transform:none}.upt{display:flex;justify-content:space-between;gap:10px;font-size:13px}.upk{height:9px;background:#555;border-radius:6px;margin-top:7px;overflow:hidden}.upf{height:100%;background:var(--c,#2f9e44);width:0;border-radius:6px;transition:width .2s}.upf.ind{width:35%!important;animation:upi 1.1s ease-in-out infinite alternate}@keyframes upi{from{margin-left:0}to{margin-left:65%}}.btn.dirty{background:#f08c00!important;color:#fff;animation:svbk .9s ease infinite}

function pnIn(k,v){PN[k]=v;var a=$('pvt'),b=$('pvb'),c=$('pvi');if(a)a.textContent=PN.t||'শিরোনাম এখানে';if(b)b.textContent=PN.b||'আপনার বার্তা এখানে দেখাবে';if(c){c.style.display=/^https:\/\//.test(PN.i)?'block':'none';c.src=/^https:\/\//.test(PN.i)?PN.i:''}}
